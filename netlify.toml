[build]
  command = "npm run build"
  publish = "dist"

# Keep Decap admin as its own entry (not swallowed by SPA fallback)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Vue Router SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
