[build]
  command = "npm run build"
  publish = "dist"

# Trailing slash so Decap loads /admin/config.yml (not /config.yml)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/cjenici"
  to = "/cjenici/"
  status = 301

# Vue Router SPA fallback (existing files like /admin/config.yml win first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/cjenici/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
