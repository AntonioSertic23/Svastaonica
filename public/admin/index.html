<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Svaštaonica — Admin</title>
    <link rel="icon" href="/svastaonica-logo-2.jpg" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div class="admin-splash">
      <img
        src="/svastaonica-logo-1.png"
        alt="Svaštaonica"
        class="admin-splash-logo"
      />
      <p>Učitavanje uređivača proizvoda…</p>
    </div>

    <div id="local-auth-note" class="local-auth-note" hidden>
      <strong>Lokalni način:</strong> prijava je namjerno otvorena (bez lozinke)
      dok radi <code>npm run cms</code>. Na produkciji se prijavljuješ GitHub
      računom (samo collaboratori s write pristupom na repo).
    </div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        const isLocal =
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
        const note = document.getElementById("local-auth-note");
        if (isLocal && note) note.hidden = false;
      })();
    </script>
  </body>
</html>
