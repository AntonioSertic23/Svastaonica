# Decap CMS — Svaštaonica product editor
# Local: npm run cms  (then open http://localhost:5173/admin/)
# Production: GitHub OAuth (Netlify Access & security → OAuth → GitHub provider)

local_backend: true

backend:
  name: github
  repo: AntonioSertic23/Svastaonica
  branch: main

logo_url: /assets/img/brand/svastaonica-logo-1.png

media_folder: public/assets/img/uploads
public_folder: /assets/img/uploads

locale: hr

collections:
  - name: site
    label: Početna stranica
    description: >-
      Postavke sadržaja na početnoj stranici weba (ne proizvodi, već što se
      ističe posjetiteljima).
    files:
      - name: homepage
        label: Najtraženiji proizvodi
        file: src/content/site/homepage.json
        description: >-
          Ovdje biraš točno 3 proizvoda koji se prikazuju na početnoj stranici
          u sekciji „Najtraženiji ručni radovi“ (ispod clip-slidera).
          Redoslijed je važan: 1. = zlatna medalja (sredina), 2. = srebrna
          (lijevo), 3. = brončana (desno). Ovo nije automatski popis
          najprodavanijih — ručno odabireš što želiš istaknuti. Promjena se
          vidi na webu nakon spremanja / objave (Netlify rebuild).
        fields:
          - label: Tri istaknuta proizvoda
            name: featuredProducts
            widget: product-multiselect
            required: true
            max: 3
            hint: >-
              Odaberi točno 3 proizvoda. Klikom uključuješ/isključuješ stavku.
              Ako su već 3 odabrana, prvo makni jednu pa dodaj drugu. Redoslijed
              odabira = 1. / 2. / 3. mjesto (zlatna / srebrna / brončana).

  - name: products
    label: Proizvodi
    label_singular: Proizvod
    description: >-
      Svaki proizvod je zasebna datoteka. Brisanje se može vratiti iz GitHub
      povijesti (commit) — vidi public/admin/README.md (Backup & restore).
    folder: src/content/products
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{id}}-{{slug}}"
    identifier_field: name
    summary: "{{name}} (ID {{id}})"
    sortable_fields: [name, id]
    editor:
      preview: false
    fields:
      - label: ID
        name: id
        widget: hidden
        default: 0

      - label: Naziv
        name: name
        widget: string

      - label: Naziv (EN)
        name: nameEn
        widget: string
        required: false
        hint: Engleski naziv — prikazuje se kad je jezik EN.

      - label: Podnaslov
        name: subheading
        widget: string
        required: false

      - label: Podnaslov (EN)
        name: subheadingEn
        widget: string
        required: false

      - label: Opis
        name: description
        widget: text
        required: false
        hint: >-
          HTML je dozvoljen (npr. <br>, <b>, <i>, <span class='important'>…).
          Za bold/italic možeš koristiti online editor
          https://html-online.com/editor/ pa zalijepiti kod ovdje.

      - label: Opis (EN)
        name: descriptionEn
        widget: text
        required: false
        hint: >-
          Engleski opis (HTML kao i gore). Prazno = prikaži hrvatski opis.

      - label: Maloprodajna cijena (€)
        name: price
        widget: number
        value_type: float
        required: false
        hint: >-
          Aktualna cijena. Ako ostane prazno, cijena se ne prikazuje
          na webu niti u CSV cjeniku.

      - label: Sidrena / dodatna cijena (€)
        name: sidrenaCijena
        widget: number
        value_type: float
        required: false
        hint: Cijena koja je vrijedila 10. 9. 2026. Prazno = ne prikazuje se.

      - label: Thumbnail
        name: thumbnail
        widget: image
        choose_url: true
        required: false

      - label: Galerija slika
        name: images
        widget: list
        required: false
        label_singular: slika
        summary: "{{fields.path}}"
        allow_add: true
        allow_delete: true
        allow_reorder: true
        fields:
          - label: Slika
            name: path
            widget: image
            choose_url: true
          - label: Početna (aktivna) slika
            name: isActive
            widget: boolean
            default: false
            required: false
            hint: Samo jedna slika bi trebala biti aktivna.

      - label: Veličine
        name: sizes
        widget: select
        multiple: true
        required: false
        options:
          - { label: "XS", value: "XS" }
          - { label: "S", value: "S" }
          - { label: "M", value: "M" }
          - { label: "L", value: "L" }

      - label: Deklaracija
        name: declaration
        widget: object
        required: false
        collapsed: true
        fields:
          - label: Tekst deklaracije
            name: text
            widget: text
            required: false
            hint: Slobodan tekst ili HTML za sadržaj deklaracije.
          - label: Tekst deklaracije (EN)
            name: textEn
            widget: text
            required: false
            hint: Engleski tekst deklaracije. Prazno = prikaži hrvatski.
          - label: Prikaži sliku standarda (OEKO-TEX)
            name: showStandardsImage
            widget: boolean
            default: false
            required: false
          - label: Ikone njege
            name: careIcons
            widget: icon-multiselect
            required: false
            options:
              - { label: "Pranje (općenito)", value: tc-wash }
              - { label: "Pranje (1)", value: tc-wash-one }
              - { label: "Pranje (2)", value: tc-wash-two }
              - { label: "Glačanje (2)", value: tc-ironing-two }
              - { label: "Bez glačanja", value: tc-no-ironing }
              - { label: "Sušenje u bubnju", value: tc-tumble-dry }
              - { label: "Kemijsko čišćenje", value: tc-dry-clean }
              - { label: "Bijeljenje", value: tc-bleach }

      - label: Slični proizvodi
        name: similarItems
        widget: product-multiselect
        required: false
        hint: Odaberi proizvode koji se prikazuju kao slični. Pokreni npm run cms:index nakon novih proizvoda ako ih ne vidiš.

      - label: Bedževi
        name: badges
        widget: icon-multiselect
        required: false
        hint: Klikni bedževe na kartici proizvoda.
        options:
          - { label: "Novo u ponudi", value: badge1 }
          - { label: "U trendu", value: badge2 }
          - { label: "Preporuka", value: badge3 }
          - { label: "Paket", value: badge5 }
          - { label: "Sigurnost", value: badge6 }

      - label: Rasprodano
        name: soldout
        widget: boolean
        default: false
        required: false
        hint: Uključi ako proizvod trenutno nije dostupan. U cjeniku piše "nedostupno".

      - label: Uskoro
        name: comingSoon
        widget: boolean
        default: false
        required: false

      - label: Kategorije
        name: categories
        widget: icon-multiselect
        required: false
        options:
          - { label: "U trendu", value: 1, image: /assets/img/ui/badge2.png }
          - { label: "Novo u ponudi", value: 2, image: /assets/img/ui/badge1.png }
          - { label: "Paketi", value: 4, image: /assets/img/ui/box.png }

      - label: Ključne riječi / ikone
        name: keywords
        widget: list
        required: false
        label_singular: ključna riječ
        summary: "{{fields.text}}"
        allow_add: true
        allow_delete: true
        allow_reorder: true
        fields:
          - label: Tekst
            name: text
            widget: string
            hint: Tekst ispod ikone na stranici proizvoda.
          - label: Ikona
            name: icon
            widget: icon-multiselect
            multiple: false
            required: false
            hint: Odaberi jednu ikonu.
            options:
              - { label: "Ručna izrada", value: "/assets/img/ui/sewing.png", image: "/assets/img/ui/sewing.png" }
              - { label: "Poklon", value: "/assets/img/ui/gift.png", image: "/assets/img/ui/gift.png" }
              - { label: "S ljubavlju", value: "/assets/img/ui/give-love.png", image: "/assets/img/ui/give-love.png" }
              - { label: "Planet", value: "/assets/img/ui/planet-earth.png", image: "/assets/img/ui/planet-earth.png" }
              - { label: "Igra", value: "/assets/img/ui/playtime.png", image: "/assets/img/ui/playtime.png" }
              - { label: "Handmade", value: "/assets/img/ui/hand-made.png", image: "/assets/img/ui/hand-made.png" }
              - { label: "Obrt", value: "/assets/img/ui/handcraft.png", image: "/assets/img/ui/handcraft.png" }
              - { label: "Zvijezde", value: "/assets/img/ui/stars.png", image: "/assets/img/ui/stars.png" }
              - { label: "Štit", value: "/assets/img/ui/shield.png", image: "/assets/img/ui/shield.png" }
              - { label: "Medalja 1", value: "/assets/img/ui/medal1.png", image: "/assets/img/ui/medal1.png" }
              - { label: "Medalja 2", value: "/assets/img/ui/medal2.png", image: "/assets/img/ui/medal2.png" }
              - { label: "Medalja 3", value: "/assets/img/ui/medal3.png", image: "/assets/img/ui/medal3.png" }
              - { label: "Novo u ponudi", value: "/assets/img/ui/badge1.png", image: "/assets/img/ui/badge1.png" }
              - { label: "U trendu", value: "/assets/img/ui/badge2.png", image: "/assets/img/ui/badge2.png" }
              - { label: "Preporuka", value: "/assets/img/ui/badge3.png", image: "/assets/img/ui/badge3.png" }
              - { label: "Paket", value: "/assets/img/ui/badge5.png", image: "/assets/img/ui/badge5.png" }
              - { label: "Sigurnost", value: "/assets/img/ui/badge6.png", image: "/assets/img/ui/badge6.png" }
              - { label: "Kutija", value: "/assets/img/ui/box.png", image: "/assets/img/ui/box.png" }

      - label: Je paket (bundle)
        name: isBundle
        widget: boolean
        default: false
        required: false
        hint: Uključi ako je ovaj proizvod paket / set.

      - label: Stavke u paketu
        name: bundleItems
        widget: product-multiselect
        required: false
        hint: Proizvodi koji ulaze u ovaj paket. Pripadnost paketu na stavkama računa se automatski.

      - label: Recenzije
        name: reviews
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.name}}"
        fields:
          - { label: Ime, name: name, widget: string }
          - { label: Komentar, name: comment, widget: text }
          - label: Komentar (EN)
            name: commentEn
            widget: text
            required: false
            hint: Engleski komentar. Prazno = prikaži hrvatski.
          - label: Slika proizvoda
            name: image
            widget: image
            choose_url: true
            required: false
            hint: Fotografija proizvoda uz recenziju (ne profilna slika kupca).
