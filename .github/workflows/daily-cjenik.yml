# Publishes a fresh CSV price list every working day before 08:00 Europe/Zagreb,
# even when prices have not changed (NN 101/2026 — products).
#
# CSVs are committed to the repo so the 30-day archive survives Netlify deploys.
# Pushing to main triggers the normal Netlify production build.

name: Daily cjenik rebuild

on:
  schedule:
    # 05:00 UTC = 07:00 CEST / 06:00 CET (always before 08:00 in Zagreb)
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-cjenik:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cjenik CSV archive
        run: npm run cjenik

      - name: Commit and push archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cjenici/
          if git diff --staged --quiet; then
            echo "No cjenik changes to commit."
            exit 0
          fi
          git commit -m "Publish daily cjenik CSV ($(TZ=Europe/Zagreb date +%Y-%m-%d))."
          git pull --rebase --autostash origin HEAD
          git push
